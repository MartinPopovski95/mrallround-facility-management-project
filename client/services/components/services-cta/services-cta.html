<!-- Call to Action Section -->
<!-- CSS Dependencies -->
<link rel="stylesheet" href="../../components/services-cta/services-cta.css" />

<section class="service-cta-section">
	<div class="page-container2 page-container4">
		<div class="service-cta-card">
			<div class="cta-content">
				<h2 class="cta-title" data-i18n="ctaTitle">
					Ready to Get Started?
				</h2>
				<p
					class="cta-description"
					data-i18n="ctaDescription">
					Contact us today for a free consultation and
					discover how we can help transform your
					space.
				</p>
				<button
					class="cta-button"
					id="openServiceFormBtn"
					data-i18n="ctaButton">
					Contact Us Today
					<svg
						viewBox="0 0 24 24"
						fill="none"
						stroke="currentColor"
						stroke-width="2"
						stroke-linecap="round"
						stroke-linejoin="round"
						class="cta-icon">
						<line
							x1="5"
							y1="12"
							x2="19"
							y2="12"></line>
						<polyline
							points="12 5 19 12 12 19"></polyline>
					</svg>
				</button>
			</div>
			<div class="cta-decorative">
				<div class="cta-circle cta-circle-1"></div>
				<div class="cta-circle cta-circle-2"></div>
				<div class="cta-circle cta-circle-3"></div>
			</div>
		</div>
	</div>
</section>
