<link rel="stylesheet" href="../../components/request-form/serviceForm.css" />

<div id="serviceFormModal" class="modal">
    <div class="modal-content">
        <div class="modal-header">
            <h2 data-i18n="formTitle">Request Service</h2>
            <button class="modal-close" id="closeServiceFormBtn" aria-label="Close modal">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>
        </div>

        <div id="formLoadingState" style="display: none; padding: 2rem; text-align: center;">
            <p>Loading form configuration...</p>
        </div>

        <form id="serviceRequestForm" class="service-form">
            <div class="form-section">
                <h3 data-i18n="contactInfo">Contact Information</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="fullName" data-i18n="fullName">Full Name *</label>
                        <input type="text" id="fullName" name="fullName" required />
                    </div>
                    <div class="form-group">
                        <label for="email" data-i18n="email">Email *</label>
                        <input type="email" id="email" name="email" required />
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="phone" data-i18n="phone">Phone Number *</label>
                        <input type="tel" id="phone" name="phone" required />
                    </div>
                </div>
            </div>

            <div id="dynamic-form-fields"></div>

            <div class="form-section" style="margin-top: 1.5rem;">
                <h3 data-i18n="serviceDate">Service Date</h3>
                <div class="form-row">
                    <div class="form-group">
                        <label for="fromDate" data-i18n="fromDate">From Date *</label>
                        <input type="date" id="fromDate" name="fromDate" required />
                    </div>
                    <div class="form-group">
                        <label for="toDate" data-i18n="toDate">To Date *</label>
                        <input type="date" id="toDate" name="toDate" required />
                    </div>
                </div>
            </div>

            <div class="form-section">
                <div class="form-group full-width">
                    <label for="comments">Additional Comments</label>
                    <textarea id="comments" name="comments" rows="3"></textarea>
                </div>
            </div>

            <div class="form-actions">
                <button type="button" class="btn-secondary" id="cancelFormBtn" data-i18n="cancel">
                    Cancel
                </button>
                <button type="submit" class="btn-primary" data-i18n="submitRequest">
                    Submit Request
                </button>
            </div>
        </form>
    </div>
</div>
